<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Nox — selected</title>
  <defs>
    <path id="ns-n" d="M56.01 44L151.93 96.9L151.93 131.34L86.17 95.07L86.17 212L56.01 212ZM199.99 212L104.07 159.1L104.07 124.66L169.83 160.93L169.83 44L199.99 44Z"/>
    <clipPath id="ns-clip"><use href="#ns-n"/></clipPath>

    <!-- Body: key light from the top left, falling to graphite at the bottom right -->
    <linearGradient id="ns-body" gradientUnits="userSpaceOnUse" x1="56" y1="44" x2="200" y2="212">
      <stop offset="0" stop-color="#E6E8EC"/>
      <stop offset=".3" stop-color="#ADB0B6"/>
      <stop offset=".5" stop-color="#7F8288"/>
      <stop offset=".63" stop-color="#91949A"/>
      <stop offset=".84" stop-color="#56595E"/>
      <stop offset="1" stop-color="#3B3D41"/>
    </linearGradient>

    <!-- Sheen: one wide, soft band across the upper arm -->
    <linearGradient id="ns-sheen" gradientUnits="userSpaceOnUse" x1="70" y1="150" x2="150" y2="40">
      <stop offset=".25" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Pool: diffuse light on the top-left corner -->
    <radialGradient id="ns-pool" gradientUnits="userSpaceOnUse" cx="64" cy="48" r="110">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Crease: the arms darken toward the gap between them, fading out before the stems -->
    <linearGradient id="ns-crease" gradientUnits="userSpaceOnUse" x1="164" y1="119.3" x2="139.9" y2="163.1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".33" stop-color="#000" stop-opacity="0.22"/>
      <stop offset=".67" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ns-armsFade" gradientUnits="userSpaceOnUse" x1="86.17" x2="169.83">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".25" stop-color="#fff"/>
      <stop offset=".75" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="ns-arms"><rect width="256" height="256" fill="url(#ns-armsFade)"/></mask>

    <!-- Falloff: the lower ends sink toward black -->
    <linearGradient id="ns-falloff" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="212">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <use href="#ns-n" fill="url(#ns-body)"/>
  <g clip-path="url(#ns-clip)">
    <rect width="256" height="256" fill="url(#ns-pool)"/>
    <rect width="256" height="256" fill="url(#ns-sheen)"/>
    <rect width="256" height="256" fill="url(#ns-crease)" mask="url(#ns-arms)"/>
    <rect width="256" height="256" fill="url(#ns-falloff)"/>

    <!-- Rim: top-facing edges catch a hairline of light -->
    <use href="#ns-n" transform="translate(0 .8)" fill="#000" fill-opacity="0.14"/>
  </g>
</svg>
