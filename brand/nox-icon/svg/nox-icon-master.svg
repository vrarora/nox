<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Nox — master</title>
  <defs>
    <path id="nm-n" d="M56.01 44L151.93 96.9L151.93 131.34L86.17 95.07L86.17 212L56.01 212ZM199.99 212L104.07 159.1L104.07 124.66L169.83 160.93L169.83 44L199.99 44Z"/>
    <clipPath id="nm-clip"><use href="#nm-n"/></clipPath>

    <!-- Body: key light from the top left, falling to graphite at the bottom right -->
    <linearGradient id="nm-body" gradientUnits="userSpaceOnUse" x1="56" y1="44" x2="200" y2="212">
      <stop offset="0" stop-color="#BEC1C7"/>
      <stop offset=".3" stop-color="#85888E"/>
      <stop offset=".5" stop-color="#5A5D62"/>
      <stop offset=".63" stop-color="#6A6D72"/>
      <stop offset=".84" stop-color="#37393D"/>
      <stop offset="1" stop-color="#2C2E32"/>
    </linearGradient>

    <!-- Sheen: one wide, soft band across the upper arm -->
    <linearGradient id="nm-sheen" gradientUnits="userSpaceOnUse" x1="70" y1="150" x2="150" y2="40">
      <stop offset=".25" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Pool: diffuse light on the top-left corner -->
    <radialGradient id="nm-pool" gradientUnits="userSpaceOnUse" cx="64" cy="48" r="110">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Crease: the arms darken toward the gap between them, fading out before the stems -->
    <linearGradient id="nm-crease" gradientUnits="userSpaceOnUse" x1="164" y1="119.3" x2="139.9" y2="163.1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".33" stop-color="#000" stop-opacity="0.24"/>
      <stop offset=".67" stop-color="#000" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nm-armsFade" gradientUnits="userSpaceOnUse" x1="86.17" x2="169.83">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".25" stop-color="#fff"/>
      <stop offset=".75" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="nm-arms"><rect width="256" height="256" fill="url(#nm-armsFade)"/></mask>

    <!-- Falloff: the lower ends sink toward black -->
    <linearGradient id="nm-falloff" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="212">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <use href="#nm-n" fill="url(#nm-body)"/>
  <g clip-path="url(#nm-clip)">
    <rect width="256" height="256" fill="url(#nm-pool)"/>
    <rect width="256" height="256" fill="url(#nm-sheen)"/>
    <rect width="256" height="256" fill="url(#nm-crease)" mask="url(#nm-arms)"/>
    <rect width="256" height="256" fill="url(#nm-falloff)"/>

    <!-- Rim: top-facing edges catch a hairline of light -->
    <use href="#nm-n" transform="translate(0 .8)" fill="#000" fill-opacity="0.12"/>
  </g>
</svg>
